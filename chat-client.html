<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat con Agente MCP</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
      }

      .container {
        width: 100%;
        max-width: 600px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        display: flex;
        flex-direction: column;
        height: 600px;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 20px;
        border-radius: 12px 12px 0 0;
        text-align: center;
      }

      .header h1 {
        font-size: 24px;
        margin-bottom: 5px;
      }

      .header p {
        font-size: 12px;
        opacity: 0.9;
      }

      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .message {
        display: flex;
        margin-bottom: 12px;
        animation: slideIn 0.3s ease-out;
      }

      @keyframes slideIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .message.user {
        justify-content: flex-end;
      }

      .message.assistant {
        justify-content: flex-start;
      }

      .message-content {
        max-width: 70%;
        padding: 12px 16px;
        border-radius: 8px;
        word-wrap: break-word;
        line-height: 1.4;
      }

      .message.user .message-content {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border-bottom-right-radius: 2px;
      }

      .message.assistant .message-content {
        background: #f0f0f0;
        color: #333;
        border-bottom-left-radius: 2px;
      }

      .message.system {
        justify-content: center;
      }

      .message.system .message-content {
        background: #e3f2fd;
        color: #1976d2;
        font-size: 12px;
        text-align: center;
        max-width: 90%;
      }

      .loading {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        color: #666;
      }

      .loading span {
        display: inline-block;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #667eea;
        animation: pulse 1.4s infinite;
      }

      .loading span:nth-child(2) {
        animation-delay: 0.2s;
      }

      .loading span:nth-child(3) {
        animation-delay: 0.4s;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.3;
        }
        50% {
          opacity: 1;
        }
      }

      .input-area {
        display: flex;
        gap: 10px;
        padding: 20px;
        border-top: 1px solid #e0e0e0;
        background: #fafafa;
        border-radius: 0 0 12px 12px;
      }

      .input-area input {
        flex: 1;
        border: 1px solid #ddd;
        border-radius: 8px;
        padding: 12px 16px;
        font-size: 14px;
        outline: none;
        transition: border-color 0.3s;
      }

      .input-area input:focus {
        border-color: #667eea;
      }

      .input-area input:disabled {
        background: #f5f5f5;
        color: #ccc;
      }

      .input-area button {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        padding: 12px 24px;
        cursor: pointer;
        font-weight: 600;
        transition: transform 0.2s;
      }

      .input-area button:hover:not(:disabled) {
        transform: scale(1.05);
      }

      .input-area button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .session-info {
        padding: 10px 20px;
        background: #f5f5f5;
        border-top: 1px solid #e0e0e0;
        font-size: 12px;
        color: #666;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .session-info button {
        background: #ff6b6b;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
      }

      .session-info button:hover {
        background: #ff5252;
      }

      .error {
        background: #ffebee;
        color: #c62828;
        padding: 12px 16px;
        border-radius: 8px;
        margin-bottom: 12px;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🤖 Agente MCP Chat</h1>
        <p>Conectado a http://localhost:3000</p>
      </div>

      <div class="chat-messages" id="messages"></div>

      <div class="session-info">
        <span id="sessionInfo">Sesión: Esperando...</span>
        <button onclick="resetChat()">Limpiar chat</button>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="messageInput"
          placeholder="Escribe tu mensaje aquí..."
          onkeypress="handleKeyPress(event)"
          disabled
        />
        <button id="sendButton" onclick="sendMessage()" disabled>Enviar</button>
      </div>
    </div>

    <script>
      const API_URL = "http://localhost:3000/api/chat";
      const SESSION_ENDPOINT = "http://localhost:3000/api/sessions";
      let currentSessionId = null;
      const messagesContainer = document.getElementById("messages");
      const messageInput = document.getElementById("messageInput");
      const sendButton = document.getElementById("sendButton");
      const sessionInfo = document.getElementById("sessionInfo");

      async function sendMessage() {
        const message = messageInput.value.trim();
        if (!message) return;

        // Desactivar input mientras se procesa
        messageInput.disabled = true;
        sendButton.disabled = true;

        // Mostrar mensaje del usuario
        addMessage(message, "user");
        messageInput.value = "";

        try {
          // Mostrar indicador de carga
          const loadingId = addLoadingIndicator();

          // Enviar mensaje a la API
          const response = await fetch(API_URL, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
            },
            body: JSON.stringify({
              sessionId: currentSessionId,
              message: message,
            }),
          });

          if (!response.ok) {
            throw new Error(`Error ${response.status}: ${response.statusText}`);
          }

          const data = await response.json();

          // Actualizar sesión
          currentSessionId = data.sessionId;
          updateSessionInfo();

          // Eliminar indicador de carga
          removeLoadingIndicator(loadingId);

          // Mostrar respuesta del agente
          addMessage(data.response, "assistant");
        } catch (error) {
          removeLoadingIndicator();
          addErrorMessage(`Error: ${error.message}`);
          console.error("Error:", error);
        } finally {
          // Reactivar input
          messageInput.disabled = false;
          sendButton.disabled = false;
          messageInput.focus();
        }
      }

      function addMessage(content, role) {
        const messageDiv = document.createElement("div");
        messageDiv.className = `message ${role}`;
        const contentDiv = document.createElement("div");
        contentDiv.className = "message-content";
        contentDiv.textContent = content;
        messageDiv.appendChild(contentDiv);
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function addErrorMessage(content) {
        const errorDiv = document.createElement("div");
        errorDiv.className = "error";
        errorDiv.textContent = content;
        messagesContainer.appendChild(errorDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
      }

      function addLoadingIndicator() {
        const messageDiv = document.createElement("div");
        messageDiv.className = "message assistant";
        messageDiv.id = "loading-" + Date.now();
        const contentDiv = document.createElement("div");
        contentDiv.className = "loading";
        contentDiv.innerHTML = "<span></span><span></span><span></span>";
        messageDiv.appendChild(contentDiv);
        messagesContainer.appendChild(messageDiv);
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
        return messageDiv.id;
      }

      function removeLoadingIndicator(loadingId) {
        const element = document.getElementById(loadingId);
        if (element) {
          element.remove();
        }
      }

      function updateSessionInfo() {
        if (currentSessionId) {
          sessionInfo.textContent = `Sesión: ${currentSessionId.substring(0, 8)}...`;
        }
      }

      async function resetChat() {
        if (!currentSessionId) return;

        if (!confirm("¿Deseas limpiar el historial de chat?")) return;

        try {
          const response = await fetch(
            `${SESSION_ENDPOINT}/${currentSessionId}/reset`,
            {
              method: "POST",
            },
          );

          if (response.ok) {
            messagesContainer.innerHTML = "";
            addMessage(
              "Chat reseteado. ¡Comienza una nueva conversación!",
              "system",
            );
          }
        } catch (error) {
          addErrorMessage(`Error al resetear: ${error.message}`);
        }
      }

      function handleKeyPress(event) {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      }

      // Inicialización
      function init() {
        messageInput.disabled = false;
        sendButton.disabled = false;
        addMessage(
          "Bienvenido al agente MCP. ¿En qué puedo ayudarte?",
          "system",
        );
        messageInput.focus();
      }

      // Esperar a que el DOM esté listo
      window.addEventListener("DOMContentLoaded", init);
    </script>
  </body>
</html>
